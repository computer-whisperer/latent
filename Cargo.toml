[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Christian Balcom"]

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
exr = "1.74"
half = { version = "2.6", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
png = "0.18"
pollster = "0.4"
rawler = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"
damascene-core = "0.8"
damascene-wgpu = "0.8"
damascene-winit-wgpu = "0.8"
rfd = "0.17"

# Our own pixel loops and the codecs are hot even in dev runs; keep the
# CLI/GUI crates unoptimised for debugging.
[profile.dev.package.idev-core]
opt-level = 2
[profile.dev.package.idev-formats]
opt-level = 2
[profile.dev.package.rawler]
opt-level = 3
[profile.dev.package.exr]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.half]
opt-level = 3

# damascene's text stack is ~500x slower unoptimised (its own profile
# guidance; overrides only apply at the consuming workspace root).
[profile.dev.package.fdsm]
opt-level = 3
[profile.dev.package.fdsm-ttf-parser]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
